# b-rs — konfigurasjon. Kopier til config.toml og tilpass.

# "paper" = simulering (trygt, standard). "live" = ekte ordrer via megleren under.
mode = "paper"

# Den konsoll-løse vindusappen (b-rs-gui.exe) kan ikke stille JA-spørsmålet,
# så den krever i tillegg live_ok = true for å handle live. Ellers papirmodus.
live_ok = false

# "paper" eller "ibkr" (Interactive Brokers via Client Portal Gateway).
broker = "paper"

# Sekunder mellom hver kursoppdatering. Yahoo-data er ~15 min forsinket,
# så det er ingen grunn til å gå under ~15 s.
poll_secs = 15

# Yahoo Finance-tickere. Oslo Børs har suffiks ".OL".
watchlist = ["EQNR.OL", "DNB.OL", "NHY.OL", "TEL.OL"]

# Startkapital i papirmodus.
starting_cash = 100000.0

# SQLite-fil for ordre- og hendelseslogg.
db_path = "b-rs.db"

[strategy]
# Strategier: "sma_cross" (SMA-krysning), "rsi" (oversolgt/overkjøpt),
# "momentum" (brudd på høyeste/laveste). Kan også byttes inne i appen.
name = "sma_cross"
fast = 5             # sma_cross: rask SMA
slow = 20            # sma_cross: treg SMA
order_qty = 10       # antall aksjer per kjøp
rsi_period = 14      # rsi: periode
rsi_buy_below = 30.0 # rsi: kjøp under denne
rsi_sell_above = 70.0 # rsi: selg over denne
momentum_window = 20 # momentum: vindu for brudd

[risk]
max_order_value = 10000.0     # maks verdi per enkeltordre
max_position_value = 25000.0  # maks posisjonsverdi per symbol
max_orders_per_min = 4        # ratebegrensning
max_daily_loss = 5000.0       # stopp all handel ved dette tapet

# Interactive Brokers — kreves bare når broker = "ibkr" og mode = "live".
# Forutsetter at Client Portal Gateway kjører lokalt og at du har logget inn
# på https://localhost:5000 i nettleseren.
# [ibkr]
# base_url = "https://localhost:5000/v1/api"
# account = "U1234567"
# accept_invalid_certs = true   # gatewayen bruker selvsignert sertifikat

[notify]
# Push-varsler til mobil: når boten handler, kill switch slås av/på,
# og når tapsgrensen stopper handelen. Et testvarsel sendes ved oppstart.
#
# Enklest er "ntfy" (gratis, ingen konto):
#   1. Installer «ntfy»-appen fra App Store / Google Play
#   2. Trykk + i appen og abonner på et selvvalgt HEMMELIG emne,
#      f.eks. "bors-ola-73xk1" (navnet er eneste passord — velg noe ugjettelig)
#   3. Sett samme navn i ntfy_topic under og enabled = true
#
# Alternativ "telegram": lag en bot via @BotFather, sett token i
# miljøvariabelen TELEGRAM_BOT_TOKEN og chat-id i telegram_chat_id.
enabled = false
provider = "ntfy"
ntfy_topic = ""
# telegram_chat_id = ""

[nordnet]
# Lesemodus via UOFFISIELT API — henter kun portefølje, handler aldri.
# Kan bryte Nordnets vilkår og slutte å virke uten varsel; brukes på eget ansvar.
# Legitimasjon settes i miljøet: NORDNET_USERNAME og NORDNET_PASSWORD.
# Fungerer ikke hvis kontoen krever BankID-innlogging.
enabled = false
poll_secs = 300
