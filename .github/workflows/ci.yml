# Kontinuerlig integrasjon: hver push og pull request bygges og testes
# automatisk på GitHub. Grønn hake = trygt å hente; rødt kryss = noe røk.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (ingen varsler tillatt)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tester
        run: cargo test
