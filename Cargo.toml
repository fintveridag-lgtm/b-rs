[package]
name = "b-rs"
version = "1.1.0"
edition = "2021"
description = "Børs-konsoll: megler-agnostisk handelsbot med papirhandel, IBKR-adapter og Nordnet-lesemodus"

[lib]
name = "b_rs"
path = "src/lib.rs"

[[bin]]
name = "b-rs"
path = "src/main.rs"

# Ren vindusapp uten konsollvindu bak (for dobbeltklikk på Windows).
[[bin]]
name = "b-rs-gui"
path = "src/gui_main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
crossterm = "0.28"
eframe = "0.29"
egui_plot = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
